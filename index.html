<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Provas Automática</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div class="max-w-4xl mx-auto p-6">
        <header class="mb-8 text-center">
            <h1 id="titulo" class="text-3xl font-bold text-indigo-600">Carregando Concurso...</h1>
            <p class="text-slate-500 mt-1">Questões separadas e corrigidas automaticamente a partir dos seus PDFs.</p>
        </header>

        <main id="app" class="space-y-10">
            <!-- Injetado dinamicamente via JS -->
        </main>
    </div>

    <script>
        async function iniciar() {
            const res = await fetch('questoes.json');
            const dados = await res.json();
            
            document.getElementById('titulo').innerText = dados.concurso;
            
            // Agrupa as questões por matéria de forma totalmente automática
            const agrupadoPorMateria = {};
            dados.questoes.forEach(q => {
                if (!agrupadoPorMateria[q.materia]) {
                    agrupadoPorMateria[q.materia] = [];
                }
                agrupadoPorMateria[q.materia].push(q);
            });

            const app = document.getElementById('app');
            app.innerHTML = '';

            // Renderiza na tela separado por blocos de matérias
            for (const [materia, questoes] of Object.entries(agrupadoPorMateria)) {
                let html = `
                    <section class="bg-white shadow-sm border border-slate-200 rounded-xl p-6">
                        <h2 class="text-xl font-bold text-slate-700 border-b pb-3 mb-6 flex justify-between items-center">
                            <span>${materia}</span>
                            <span class="text-xs bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full font-semibold">${questoes.length} questões</span>
                        </h2>
                        <div class="space-y-8">
                `;

                questoes.forEach((q, idx) => {
                    html += `
                        <div class="pb-6 border-b border-slate-100 last:border-0 last:pb-0" id="q-${q.id}">
                            <p class="font-medium text-slate-900 mb-3">Questão ${q.id}: ${q.enunciado}</p>
                            <div class="space-y-2">
                    `;

                    q.alternativas.forEach(alt => {
                        const letra = alt.charAt(0);
                        html += `
                            <button onclick="verificar(this, '${letra}', '${q.resposta_correta}', ${q.id})"
                                class="w-full text-left px-4 py-2.5 rounded-lg border border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 transition-all text-sm">
                                ${alt}
                            </button>
                        `;
                    });

                    html += `
                            </div>
                            <div class="feedback mt-3 text-sm font-semibold hidden"></div>
                        </div>
                    `;
                });

                html += `</div></section>`;
                app.innerHTML += html;
            }
        }

        function verificar(botao, escolhida, correta, id) {
            const container = document.getElementById(`q-${id}`);
            const botoes = container.querySelectorAll('button');
            const feedback = container.querySelector('.feedback');

            botoes.forEach(b => {
                b.disabled = true;
                b.classList.remove('hover:bg-indigo-50', 'hover:border-indigo-300');
                if (b.textContent.charAt(0) === correta) {
                    b.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900');
                }
            });

            if (escolhida !== correta) {
                botao.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');
                feedback.textContent = `Incorreto! A alternativa correta é (${correta}).`;
                feedback.className = 'feedback mt-3 text-sm font-semibold text-rose-600';
            } else {
                feedback.textContent = 'Parabéns, resposta correta!';
                feedback.className = 'feedback mt-3 text-sm font-semibold text-emerald-600';
            }
            feedback.classList.remove('hidden');
        }

        iniciar();
    </script>
</body>
</html>
